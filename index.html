<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div class="min-h-screen bg-gray-100 text-gray-900 flex justify-center" id="inicio">
        <div class="max-w-screen-xl m-0 sm:m-10 bg-white shadow sm:rounded-lg flex justify-center flex-1">
            <div class="lg:w-1/2 xl:w-5/12 sm:p-12 md:p-2">
                <div class="h-60 w-60 m-auto">
                    <img src='images/logo.png' alt=''>
                </div>

                <div class="flex flex-col items-center">
                    <div class="w-full flex-1 mt-8">
                        <div class="flex flex-col items-center">
                        </div>

                        <div class="mx-auto max-w-xs">
                            <input
                                class="w-full px-8 py-4 rounded-lg font-medium bg-gray-100 border border-gray-200 placeholder-gray-500 text-sm focus:outline-none focus:border-gray-400 focus:bg-white"
                                type="email" placeholder="Correo" id="correo" required/>
                            <input
                                class="w-full px-8 py-4 rounded-lg font-medium bg-gray-100 border border-gray-200 placeholder-gray-500 text-sm focus:outline-none focus:border-gray-400 focus:bg-white mt-5" id="contraseña"
                                type="password" placeholder="Contraseña" required/>
                            <button
                                class="mt-5 tracking-wide font-semibold bg-green-400 text-white-500 w-full py-4 rounded-lg hover:bg-green-700 transition-all duration-300 ease-in-out flex items-center justify-center focus:shadow-outline focus:outline-none" id="button">
                                <svg class="w-6 h-6 -ml-2" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                                    <circle cx="8.5" cy="7" r="4" />
                                    <path d="M20 8v6M23 11h-6" />
                                </svg>
                                <span class="ml-">
                                    Iniciar sesion
                                </span>
                            </button>
                            <p class="mt-6 text-xs text-gray-600 text-center">
                                Acepto los
                                <a href="#" class="border-b border-gray-500 border-dotted">
                                    Términos de servicio
                                </a>
                                y la
                                <a href="#" class="border-b border-gray-500 border-dotted">
                                    Política de Privacidad
                                </a>
                                de FinTrack
                            </p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex-1 bg-green-100 hidden lg:flex">
                <div class="m-auto h-[450px]">
                    <img src='images/—Pngtree—personal finance training courses with_20373748.png' alt=''
                        class="w-full h-full">
                </div>
            </div>
        </div>
    </div>

    <script src="js/index.js"></script>
</body>

</html>
